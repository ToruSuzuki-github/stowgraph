<style>
  :root {

    --warn-text: #8a3b1e;
    --grid: #e8e6dc;
    --tint: 13%;
    --shadow: 0 1px 2px rgb(20 20 19 / 0.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1f1e1d;
      --surface: #262624;
      --surface-2: #30302e;
      --text: #faf9f5;
      --muted: #b0aea5;
      --border: #3e3d39;
      --edge: #77756d;
      --focus: #5b8cff;
      --accent-soft: #1b2a4a;
      --clay: #e08a6c;
      --chrome: #0b1630;
      --chrome-text: #faf9f5;
      --running: #4fd08e;
      --warn-bg: #3a2419;
      --warn-text: #f0b49a;
      --grid: #34332f;
      --tint: 24%;
      --shadow: none;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1f1e1d;
    --surface: #262624;
    --surface-2: #30302e;
    --text: #faf9f5;
    --muted: #b0aea5;
    --border: #3e3d39;
    --edge: #77756d;
    --focus: #5b8cff;
    --accent-soft: #1b2a4a;
    --clay: #e08a6c;
    --chrome: #0b1630;
    --chrome-text: #faf9f5;
    --running: #4fd08e;
    --warn-bg: #3a2419;
    --warn-text: #f0b49a;
    --grid: #34332f;
    --tint: 24%;
    --shadow: none;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 Inter, system-ui, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  h1, h2.serif, .detail-title, .empty h2 { font-family: inherit; font-variant-numeric: lining-nums; }
  code, .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, "SFMono-Regular", monospace; font-size: 12px; }
  button, .button {
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover, .button:hover { background: var(--surface-2); }
  button:focus-visible, .button:focus-within, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    padding: 10px 16px;
    background: var(--chrome);
    color: var(--chrome-text);
    border-bottom: 2px solid var(--clay);
  }
  header h1 { font-size: 18px; font-weight: 500; margin: 0; letter-spacing: 0.01em; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { display: block; }
  .tagline { color: color-mix(in srgb, var(--chrome-text) 70%, transparent); font-size: 13px; }
  @media (max-width: 760px) { .tagline { display: none; } }
  #status { color: color-mix(in srgb, var(--chrome-text) 70%, transparent); font-size: 13px; flex: 1 1 200px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  .button input { display: none; }
  header .button, header button { color: var(--chrome-text); background: transparent; border-color: color-mix(in srgb, var(--chrome-text) 35%, transparent); }
  header .button:hover, header button:hover { background: color-mix(in srgb, var(--chrome-text) 12%, transparent); }
  header .button.primary { background: #1d63ed; border-color: #1d63ed; color: #fff; }
  header .button.primary:hover { background: #0d4df2; border-color: #0d4df2; }
  header .button:focus-within, header button:focus-visible { outline-color: #fff; }

  .layout {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr) 300px;
    grid-template-areas: "side graph detail";
    flex: 1;
  }
  footer { padding: 8px 16px; border-top: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 12px; text-align: center; }
  footer a { color: inherit; }
  aside.side { grid-area: side; border-right: 1px solid var(--border); padding: 16px; background: var(--surface); }
  main { grid-area: graph; position: relative; min-width: 0; display: flex; flex-direction: column; }
  aside.detail { grid-area: detail; border-left: 1px solid var(--border); padding: 16px; background: var(--surface); overflow-wrap: anywhere; }

  h2 { font-size: 12px; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 8px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ""; width: 3px; height: 12px; border-radius: 2px; background: var(--clay); flex: none; }
  section + section { margin-top: 20px; }

  .repo { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: start; padding: 8px; border-radius: 6px; cursor: pointer; }
  .repo:hover { background: var(--surface-2); }
  .repo input { margin: 3px 0 0; accent-color: var(--repo); }
  .repo .name { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .repo .swatch { width: 12px; height: 12px; border-radius: 3px; background: var(--repo); flex: none; }
  .repo .meta { grid-column: 2; color: var(--muted); font-size: 12px; }
  .repo.off .name, .repo.off .meta { opacity: 0.45; }

  .key { display: grid; grid-template-columns: 56px 1fr; gap: 6px 10px; align-items: center; font-size: 13px; }
  .key svg { display: block; }

  .roles { display: block; font-size: 13px; }
  .roles dt { color: var(--text); font-weight: 600; }
  .roles dd { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
  .roles-note { color: var(--muted); font-size: 12px; margin: 0; }
  .role-desc { color: var(--muted); font-size: 12px; margin: -8px 0 12px; }

  .warnings { background: var(--warn-bg); color: var(--warn-text); border-radius: 6px; padding: 8px 10px; font-size: 12px; }
  .warnings ul { margin: 0; padding-left: 18px; }

  .toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .toolbar[hidden] { display: none; }
  .toolbar button { padding: 2px 10px; border-radius: 999px; }
  .toolbar span { color: var(--muted); font-size: 12px; min-width: 44px; text-align: center; }
  .graph-wrap {
    flex: 1; overflow: auto; position: relative;
    background-color: var(--bg);
    background-image: radial-gradient(var(--grid) 1px, transparent 1px);
    background-size: 20px 20px;
  }
  #graph { display: block; }
  #graph text { fill: var(--text); font-family: Inter, system-ui, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; }
  #graph .col-title { fill: var(--muted); font-size: 12px; font-weight: 600; }
  #graph .node { cursor: pointer; }
  #graph .node:focus { outline: none; }
  #graph .node:focus-visible .shape { stroke: var(--focus); stroke-width: 2; }
  #graph .node .sub { fill: var(--muted); font-size: 12px; }
  #graph .node.selected .shape { stroke: var(--clay); stroke-width: 2.5; }
  #graph .dim { opacity: 0.18; }
  #graph .edge, #graph .node { transition: opacity 120ms; }

  .empty { max-width: 560px; margin: 48px auto; padding: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
  .empty[hidden] { display: none; }
  .empty h2 { font-size: 18px; font-weight: 500; letter-spacing: 0; color: var(--text); margin-bottom: 12px; }
  .empty h2::before { display: none; }
  .empty ol { padding-left: 20px; }
  .empty li + li { margin-top: 8px; }
  pre { background: #141413; color: #faf9f5; border-radius: 8px; padding: 8px 12px; overflow-x: auto; margin: 6px 0 0; }
  .empty code { color: var(--focus); }
  pre code { color: inherit; }

  dl { display: grid; grid-template-columns: 92px 1fr; gap: 6px 10px; margin: 0; font-size: 13px; }
  dt { color: var(--muted); }
  dd { margin: 0; min-width: 0; }
  .chip { display: inline-flex; align-items: center; gap: 5px; margin: 0 6px 4px 0; }
  .chip i { width: 10px; height: 10px; border-radius: 2px; background: var(--repo); display: inline-block; }
  .link { background: none; border: none; padding: 0; color: var(--focus); text-decoration: underline; cursor: pointer; text-align: left; font: inherit; overflow-wrap: anywhere; }
  .detail-title { font-size: 17px; font-weight: 500; margin: 0 0 6px; overflow-wrap: anywhere; }
  .detail-kind { display: inline-block; color: var(--focus); background: var(--accent-soft); border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 600; margin-bottom: 12px; }
  .repo .meta { font-variant-numeric: tabular-nums; }
  .hint { color: var(--muted); font-size: 13px; }

  @media (max-width: 1100px) {
    .layout { grid-template-columns: 240px minmax(0, 1fr); grid-template-areas: "side graph" "detail detail"; }
    aside.detail { border-left: none; border-top: 1px solid var(--border); }
  }
  @media (max-width: 760px) {
    .layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "side" "graph" "detail"; }
    aside.side { border-right: none; border-bottom: 1px solid var(--border); }
    .graph-wrap { max-height: 70vh; min-height: 320px; }
  }
</style>
</head>

<header>
  <div class="brand">

      <rect x="2" y="3" width="9" height="9" rx="2" fill="#5fb4f5"/>
      <rect x="13" y="3" width="9" height="9" rx="4.5" fill="#d97757"/>
    </svg>
    <h1>Stowgraph</h1>
    <span class="tagline" data-i18n="tagline">Relationship graph of Docker images and containers</span>
  </div>
  <div id="status"></div>
  <div class="controls">
    <label class="button primary" data-i18n-title="pickTitle" title="Choose the repos folder (or its parent)">
      <span data-i18n="pick">Choose folder</span>
      <input id="pick" type="file" webkitdirectory multiple>
    </label>
    <label class="button" data-i18n-title="pickFilesTitle" title="Choose one or more JSON files">
      <span data-i18n="pickFiles">Choose files</span>
      <input id="pick-files" type="file" accept=".json,application/json" multiple>
    </label>
    <button id="reload" type="button" hidden data-i18n="reload">Reload</button>
    <button id="lang" type="button" lang="ja">日本語</button>
  </div>
</header>

<div class="layout">
  <aside class="side">
    <section>
      <h2 data-i18n="repos">Repositories</h2>
      <div id="repos" class="hint"></div>
    </section>
    <section>
      <h2 data-i18n="howto">How to read</h2>
      <div class="key" id="key"></div>
    </section>
    <section>
      <h2 data-i18n="roles">Image roles</h2>
      <dl class="roles" id="roles"></dl>
      <p class="roles-note" data-i18n="rolesNote"></p>
    </section>
    <section id="warn-section" hidden>
      <h2 data-i18n="warnTitle">Notices</h2>
      <div class="warnings"><ul id="warnings"></ul></div>
    </section>
  </aside>

  <main>
    <div class="toolbar" id="toolbar" hidden>
      <button type="button" id="zoom-out" data-i18n-aria="zoomOut" aria-label="Zoom out">−</button>
      <span id="zoom-label">100%</span>
      <button type="button" id="zoom-in" data-i18n-aria="zoomIn" aria-label="Zoom in">＋</button>
      <button type="button" id="zoom-reset" data-i18n="zoomReset">Actual size</button>
    </div>
    <div class="graph-wrap" id="wrap">
      <div class="empty" id="empty"></div>
      <svg id="graph" hidden role="img" data-i18n-aria="graphAria" aria-label="Relationship graph of Docker images and containers"></svg>
    </div>
  </main>

  <aside class="detail" id="detail"></aside>
</div>

function initialLang() {
  try {
    const saved = localStorage.getItem("stowgraph.lang");
    if (saved === "en" || saved === "ja") return saved;
  } catch (_) { /* if localStorage is unavailable, give up on saving the choice */ }
  return (navigator.language || "").toLowerCase().startsWith("ja") ? "ja" : "en";
}
let lang = initialLang();
function t(key, ...args) {
  const v = I18N[lang][key];
  return typeof v === "function" ? v(...args) : v;
}
const hasText = (key) => key in I18N[lang];
// Turn an array of text parts (strings mixed with { code }) into DOM nodes
const rich = (parts) => parts.map((p) => (typeof p === "string" ? p : h("code", {}, [p.code])));

// ---- State ------------------------------------------------------------
const model = { repos: [], images: new Map(), containers: new Map(), warnings: [], skipped: [] };
const view = { hidden: new Set(), selected: null, zoom: 1, source: "", error: null };

// ---- Loading ----------------------------------------------------------
class LoadError extends Error {
  constructor(key, ...args) { super(key); this.key = key; this.args = args; }
}

async function loadFromServer() {
  let names = [];
  try {
    const r = await fetch("repos/index.json", { cache: "no-store" });
    if (r.ok) names = await r.json();
  } catch (_) { /* if there is no index file, fall back to the directory listing */ }
  if (!Array.isArray(names) || names.length === 0) {
    const r = await fetch("repos/", { cache: "no-store" });
    if (!r.ok) throw new LoadError("errFetchRepos", r.status);
    const html = await r.text();
    names = [...html.matchAll(/href="([^"?#]+\.json)"/gi)].map((m) => decodeURIComponent(m[1]));
  }
  names = [...new Set(names)].filter((n) => !/(^|\/)index\.json$/.test(n));
  const files = await Promise.all(names.map(async (n) => {
    const r = await fetch(`repos/${encodeURI(n)}`, { cache: "no-store" });
    return { name: n, text: r.ok ? await r.text() : null };
  }));
  ingest(files, "srcServer");
}

async function readFiles(fileList, sourceKey) {
  const files = await Promise.all([...fileList]
    .filter((f) => f.name.toLowerCase().endsWith(".json"))
    .map(async (f) => ({ name: f.webkitRelativePath || f.name, text: await f.text() })));
  ingest(files, sourceKey);
}

// ---- Validation and merging -------------------------------------------
const isId = (v) => typeof v === "string" && /^sha256:[0-9a-f]{64}$/.test(v);
const isCid = (v) => typeof v === "string" && /^[0-9a-f]{64}$/.test(v);

function ingest(files, sourceKey) {
  model.repos = []; model.images = new Map(); model.containers = new Map();
  model.warnings = []; model.skipped = [];
  const warn = (key, ...args) => model.warnings.push({ key, args });

  const repoFiles = [];
  for (const f of files) {
    if (f.text === null) { warn("warn.loadFail", f.name); continue; }
    let data;
    try { data = JSON.parse(f.text); } catch (e) { warn("warn.badJson", f.name, e.message); continue; }
    if (!data || typeof data !== "object" || !("schemaVersion" in data) || !("repository" in data)) {
      model.skipped.push(f.name); continue;  // A file that is not repository data, such as the schema definition
    }
    if (data.schemaVersion !== SCHEMA_VERSION) { warn("warn.schemaVersion", f.name, data.schemaVersion); continue; }
    const name = data.repository && data.repository.name;
    if (typeof name !== "string" || name === "") { warn("warn.noRepoName", f.name); continue; }
    if (!Array.isArray(data.images) || !Array.isArray(data.containers)) { warn("warn.notArrays", f.name); continue; }
    if (repoFiles.some((r) => r.data.repository.name === name)) { warn("warn.dupName", f.name, name); continue; }
    repoFiles.push({ file: f.name, data });
  }
  repoFiles.sort((a, b) => a.data.repository.name.localeCompare(b.data.repository.name, "ja"));

  let auto = 0;
  for (const { file, data } of repoFiles) {
    const r = data.repository;
    const color = typeof r.color === "string" && /^#[0-9a-fA-F]{6}$/.test(r.color) ? r.color : PALETTE[auto++ % PALETTE.length];
    const repo = { name: r.name, path: r.path || "", color, file, generatedAt: data.generatedAt || "", images: 0, containers: 0 };
    model.repos.push(repo);

    data.images.forEach((im, i) => {
      if (!im || !isId(im.id)) { warn("warn.imageId", file, i); return; }
      const n = getImage(im.id);
      n.placeholder = false;
      n.repos.add(repo.name);
      (Array.isArray(im.tags) ? im.tags : []).forEach((t) => n.tags.add(t));
      if (im.parent != null) {
        if (!isId(im.parent)) warn("warn.parentInvalid", file, i);
        else if (n.parent && n.parent !== im.parent) warn("warn.parentConflict", shortId(im.id), file);
        else n.parent = im.parent;
      }
      if (im.role && !n.role) n.role = im.role;
      if (Number.isInteger(im.layers)) n.layers = im.layers;
      if (Number.isInteger(im.size)) n.size = im.size;
      if (im.created) n.created = im.created;
      repo.images++;
    });
    data.containers.forEach((c, i) => {
      if (!c || !isCid(c.id) || !isId(c.image)) { warn("warn.containerInvalid", file, i); return; }
      const n = model.containers.get(c.id) || { kind: "container", id: c.id, repos: new Set() };
      Object.assign(n, { name: c.name || shortId(c.id), image: c.image, state: c.state || "", created: c.created || "" });
      n.repos.add(repo.name);
      model.containers.set(c.id, n);
      repo.containers++;
    });
  }

  // An ID with no definition is filled in as an "unknown image"
  const refs = [];
  for (const n of model.images.values()) if (n.parent) refs.push([n.parent, n]);
  for (const c of model.containers.values()) refs.push([c.image, c]);
  for (const [id, from] of refs) {
    if (!model.images.has(id) || model.images.get(id).placeholder) {
      const p = getImage(id);
      from.repos.forEach((r) => p.repos.add(r));
      warn("warn.undefinedRef", shortId(id), from.id);
    }
  }
  for (const n of model.images.values()) {
    if (!n.role) n.role = n.parent ? "derived" : ([...model.images.values()].some((m) => m.parent === n.id) ? "base" : "runtime");
  }

  view.source = sourceKey;
  view.error = null;
  view.hidden = new Set([...view.hidden].filter((r) => model.repos.some((x) => x.name === r)));
  if (view.selected && !nodeById(view.selected)) view.selected = null;
  renderAll();
}

function getImage(id) {
  if (!model.images.has(id)) model.images.set(id, { kind: "image", id, tags: new Set(), parent: null, role: "", repos: new Set(), placeholder: true });
  return model.images.get(id);
}
const nodeById = (id) => model.images.get(id) || model.containers.get(id);
const repoByName = (name) => model.repos.find((r) => r.name === name);
const shortId = (id) => id.replace(/^sha256:/, "").slice(0, 12);

const roleText = (role) => (hasText(`role.${role}`) ? t(`role.${role}`) : "");
const roleShortText = (role) => (hasText(`roleShort.${role}`) ? t(`roleShort.${role}`) : "");
const stateText = (state) => (hasText(`state.${state}`) ? t(`state.${state}`) : state || "");

function label(n) {
  if (n.kind === "container") return n.name;
  if (n.placeholder) return t("unknownImage");
  const tags = [...n.tags];
  if (tags.length === 0) return "<none>";
  const m = tags[0].match(/^(vsc-.+?)-[0-9a-f]{64}(-uid)?(?::latest)?$/);
  const main = m ? `${m[1]}-…${m[2] || ""}` : tags[0].split("/").pop();
  return tags.length > 1 ? `${main} ${t("more", tags.length - 1)}` : main;
}

// ---- Graph construction -----------------------------------------------
function visibleRepos(n) { return [...n.repos].filter((r) => !view.hidden.has(r)).sort((a, b) => repoIndex(a) - repoIndex(b)); }
function repoIndex(name) { return model.repos.findIndex((r) => r.name === name); }

function buildGraph() {
  const nodes = [...model.images.values(), ...model.containers.values()].filter((n) => visibleRepos(n).length > 0);
  const vis = new Set(nodes.map((n) => n.id));
  const pred = (n) => (n.kind === "image" ? n.parent : n.image);
  const children = new Map(nodes.map((n) => [n.id, []]));
  const edges = [];
  for (const n of nodes) {
    const p = pred(n);
    if (p && vis.has(p)) { children.get(p).push(n.id); edges.push({ from: p, to: n.id, type: n.kind === "image" ? "derive" : "run" }); }
  }

  const depth = new Map();
  const depthOf = (id, guard = 0) => {
    if (depth.has(id)) return depth.get(id);
    const n = nodeById(id);
    const d = n.parent && vis.has(n.parent) && guard < 50 ? depthOf(n.parent, guard + 1) + 1 : 0;
    depth.set(id, d);
    return d;
  };
  const images = nodes.filter((n) => n.kind === "image");
  images.forEach((n) => depthOf(n.id));
  const maxDepth = images.length ? Math.max(...images.map((n) => depth.get(n.id))) : -1;
  const hasContainers = nodes.some((n) => n.kind === "container");
  const colOf = (n) => (n.kind === "image" ? depth.get(n.id) : maxDepth + 1);
  const cols = maxDepth + 1 + (hasContainers ? 1 : 0);

  const sortKey = (a, b) => {
    const na = nodeById(a), nb = nodeById(b);
    if (na.kind !== nb.kind) return na.kind === "image" ? -1 : 1;
    const ra = repoIndex(visibleRepos(na)[0]), rb = repoIndex(visibleRepos(nb)[0]);
    return ra - rb || label(na).localeCompare(label(nb), "ja");
  };
  children.forEach((list) => list.sort(sortKey));
  const roots = nodes.filter((n) => !pred(n) || !vis.has(pred(n))).map((n) => n.id).sort(sortKey);

  // Give each leaf its own row and place a parent at the middle of its children (it is a tree, so edges do not cross)
  const pos = new Map();
  let cursor = PAD + HEAD_H, lastGroup = null;
  const visit = (id) => {
    const n = nodeById(id);
    const kids = children.get(id);
    let y;
    if (kids.length === 0) { y = cursor; cursor += PITCH_Y; }
    else { const ys = kids.map(visit); y = (ys[0] + ys[ys.length - 1]) / 2; }
    pos.set(id, { x: PAD + colOf(n) * (NODE_W + COL_GAP), y });
    return y;
  };
  for (const r of roots) {
    const g = visibleRepos(nodeById(r)).join("|");
    if (lastGroup !== null && g !== lastGroup) cursor += GROUP_GAP;
    lastGroup = g;
    visit(r);
  }

  const titles = [];
  for (let c = 0; c <= maxDepth; c++) titles.push(c === 0 ? t("colFirst") : maxDepth > 1 ? t("colDerivedN", c) : t("colDerived"));
  if (hasContainers) titles.push(t("colContainers"));
  return {
    nodes, edges, pos, children, titles,
    width: PAD * 2 + Math.max(cols, 1) * NODE_W + Math.max(cols - 1, 0) * COL_GAP,
    height: cursor - PITCH_Y + NODE_H + PAD,
  };
}

// ---- Rendering --------------------------------------------------------
function el(tag, attrs = {}, kids = []) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== undefined && v !== null) e.setAttribute(k, v);
  for (const k of kids) e.append(k);
  return e;
}
const measureCtx = document.createElement("canvas").getContext("2d");
function fit(text, maxW, font) {
  measureCtx.font = font;
  if (measureCtx.measureText(text).width <= maxW) return text;
  let lo = 1, hi = text.length;
  while (lo < hi) {
    const mid = Math.ceil((lo + hi) / 2);
    const head = Math.ceil(mid * 0.6), tail = mid - head;
    const t = text.slice(0, head) + "…" + (tail ? text.slice(-tail) : "");
    if (measureCtx.measureText(t).width <= maxW) lo = mid; else hi = mid - 1;
  }
  const head = Math.ceil(lo * 0.6), tail = lo - head;
  return text.slice(0, head) + "…" + (tail ? text.slice(-tail) : "");
}
const FONT = 'Inter, system-ui, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif';

let graph = null;

function renderEmpty(box, filtered) {
  if (filtered) {
    box.replaceChildren(h("h2", {}, [t("emptyFilteredTitle")]), h("p", { class: "hint" }, [t("emptyFilteredHint")]));
    return;
  }
  const g = t("guide");
  box.replaceChildren(
    h("h2", {}, [g.title]),
    h("ol", {}, g.steps.map((st) => h("li", {}, [...rich(st.text), st.cmd ? h("pre", {}, [st.cmd]) : null]))),
  );
}

function renderGraph() {
  const svg = document.getElementById("graph");
  svg.replaceChildren();
  graph = buildGraph();
  const empty = graph.nodes.length === 0;
  svg.hidden = empty;
  document.getElementById("toolbar").hidden = empty;
  const emptyBox = document.getElementById("empty");
  emptyBox.hidden = !empty;
  if (empty) {
    renderEmpty(emptyBox, model.repos.length > 0);
    return;
  }

  svg.setAttribute("viewBox", `0 0 ${graph.width} ${graph.height}`);
  applyZoom();

  graph.titles.forEach((t, c) => {
    svg.append(el("text", { class: "col-title", x: PAD + c * (NODE_W + COL_GAP) + 2, y: PAD + 12 }, [t]));
  });

  const edgeLayer = el("g");
  const nodeLayer = el("g");
  svg.append(edgeLayer, nodeLayer);

  for (const e of graph.edges) {
    const a = graph.pos.get(e.from), b = graph.pos.get(e.to);
    const x1 = a.x + NODE_W, y1 = a.y + NODE_H / 2, x2 = b.x - 7, y2 = b.y + NODE_H / 2;
    const dx = Math.max(40, (x2 - x1) / 2);
    const target = visibleRepos(nodeById(e.to));
    const color = target.length === 1 ? repoByName(target[0]).color : "var(--edge)";
    const g = el("g", { class: "edge", "data-from": e.from, "data-to": e.to });
    g.append(el("path", {
      d: `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`,
      fill: "none", stroke: color, "stroke-width": 2, "stroke-dasharray": e.type === "run" ? "6 4" : null,
    }));
    g.append(el("path", { d: `M${x2},${y2 - 5} L${x2 + 7},${y2} L${x2},${y2 + 5} Z`, fill: color }));
    g.append(el("title", {}, [e.type === "run" ? t("edgeRun") : t("edgeDerive")]));
    edgeLayer.append(g);
  }

  for (const n of graph.nodes) {
    const p = graph.pos.get(n.id);
    const repos = visibleRepos(n);
    const single = repos.length === 1 ? repoByName(repos[0]).color : null;
    const isC = n.kind === "container";
    const g = el("g", {
      class: "node" + (view.selected === n.id ? " selected" : ""),
      transform: `translate(${p.x},${p.y})`, tabindex: 0, role: "button", "data-id": n.id,
      "aria-label": `${isC ? t("kindContainer") : t("kindImage")} ${label(n)}`,
    });
    g.append(el("rect", {
      class: "shape", width: NODE_W, height: NODE_H, rx: isC ? NODE_H / 2 : 7,
      style: single ? `fill: color-mix(in srgb, ${single} var(--tint), var(--surface))` : "fill: var(--surface-2)",
      stroke: "var(--border)", "stroke-width": 1,
      "stroke-dasharray": (isC && n.state !== "running") || n.placeholder ? "5 3" : null,
    }));
    // Repository color band (a shared node gets stripes)
    const barX = isC ? 14 : 6, barH = NODE_H - 16;
    repos.forEach((r, i) => {
      g.append(el("rect", { x: barX, y: 8 + (barH / repos.length) * i, width: 5, height: barH / repos.length, fill: repoByName(r).color }));
    });
    const tx = barX + 13, maxW = NODE_W - tx - (isC ? 22 : 10);
    const main = label(n);
    const sub = isC
      ? t("subContainer", stateText(n.state) || t("stateUnknown"), shortId(n.id))
      : n.placeholder ? `${t("noDefinition")} · ${shortId(n.id)}`
      : `${roleShortText(n.role) || t("kindImage")}${n.layers != null ? t("layersN", n.layers) : ""}${repos.length > 1 ? t("sharedN", repos.length) : ""}`;
    g.append(el("text", { x: tx, y: 24, "font-size": 13, "font-weight": 600 }, [fit(main, maxW, `600 13px ${FONT}`)]));
    g.append(el("text", { class: "sub", x: tx, y: 42 }, [fit(sub, maxW, `12px ${FONT}`)]));
    if (isC && n.state === "running") g.append(el("circle", { cx: NODE_W - 20, cy: NODE_H / 2, r: 4, fill: "var(--running)" }));
    g.append(el("title", {}, [[...(n.kind === "image" ? n.tags : [n.name])].join("\n") || shortId(n.id)]));
    nodeLayer.append(g);
  }
}

function lineage(id) {
  const set = new Set([id]);
  let n = nodeById(id), guard = 0;
  while (n && guard++ < 50) {
    const p = n.kind === "image" ? n.parent : n.image;
    if (!p) break;
    set.add(p); n = nodeById(p);
  }
  const stack = [id];
  while (stack.length) for (const c of graph.children.get(stack.pop()) || []) if (!set.has(c)) { set.add(c); stack.push(c); }
  return set;
}
function highlight(id) {
  const svg = document.getElementById("graph");
  const set = id ? lineage(id) : null;
  svg.querySelectorAll(".node").forEach((g) => g.classList.toggle("dim", !!set && !set.has(g.dataset.id)));
  svg.querySelectorAll(".edge").forEach((g) => g.classList.toggle("dim", !!set && !(set.has(g.dataset.from) && set.has(g.dataset.to))));
}

function applyZoom() {
  const svg = document.getElementById("graph");
  if (!graph) return;
  svg.setAttribute("width", Math.round(graph.width * view.zoom));
  svg.setAttribute("height", Math.round(graph.height * view.zoom));
  document.getElementById("zoom-label").textContent = `${Math.round(view.zoom * 100)}%`;
}

// ---- Side panels ------------------------------------------------------
function fmtDate(s) {
  const d = new Date(s);
  if (!s || isNaN(d)) return "—";
  return lang === "ja"
    ? d.toLocaleString("ja-JP", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" })
    : d.toLocaleString("en-US", { year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
function fmtSize(b) {
  if (b == null) return "—";
  return b >= 1e9 ? `${(b / 1e9).toFixed(2)} GB` : b >= 1e6 ? `${(b / 1e6).toFixed(1)} MB` : `${Math.round(b / 1e3)} KB`;
}
function h(tag, attrs = {}, kids = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids) if (k !== null && k !== undefined) e.append(k);
  return e;
}

function renderRepos() {
  const box = document.getElementById("repos");
  box.className = "";
  if (model.repos.length === 0) { box.className = "hint"; box.textContent = t("reposNone"); return; }
  box.replaceChildren(...model.repos.map((r) => {
    const on = !view.hidden.has(r.name);
    const input = h("input", { type: "checkbox", checked: on, "aria-label": t("repoShow", r.name),
      onchange: () => { input.checked ? view.hidden.delete(r.name) : view.hidden.add(r.name); renderAll(); } });
    return h("label", { class: "repo" + (on ? "" : " off"), style: `--repo: ${r.color}`, title: r.path || r.file }, [
      input,
      h("span", { class: "name" }, [h("span", { class: "swatch" }), r.name]),
      h("span", { class: "meta" }, [t("repoMeta", r.images, r.containers), h("br"), t("repoGenerated", fmtDate(r.generatedAt))]),
    ]);
  }));
}

function renderKey() {
  const sample = (kids) => el("svg", { width: 56, height: 24, viewBox: "0 0 56 24" }, kids);
  const items = [
    [sample([el("rect", { x: 1, y: 3, width: 54, height: 18, rx: 4, fill: "var(--surface-2)", stroke: "var(--border)" })]), t("keyImage")],
    [sample([el("rect", { x: 1, y: 3, width: 54, height: 18, rx: 9, fill: "var(--surface-2)", stroke: "var(--border)" }), el("circle", { cx: 45, cy: 12, r: 3, fill: "var(--running)" })]), t("keyRunning")],
    [sample([el("rect", { x: 1, y: 3, width: 54, height: 18, rx: 9, fill: "var(--surface-2)", stroke: "var(--border)", "stroke-dasharray": "5 3" })]), t("keyStopped")],
    [sample([el("path", { d: "M2,12 H46", stroke: "var(--edge)", "stroke-width": 2 }), el("path", { d: "M46,7 L53,12 L46,17 Z", fill: "var(--edge)" })]), t("keyDerive")],
    [sample([el("path", { d: "M2,12 H46", stroke: "var(--edge)", "stroke-width": 2, "stroke-dasharray": "6 4" }), el("path", { d: "M46,7 L53,12 L46,17 Z", fill: "var(--edge)" })]), t("keyRun")],
    [sample([el("rect", { x: 20, y: 2, width: 6, height: 10, fill: PALETTE[0] }), el("rect", { x: 20, y: 12, width: 6, height: 10, fill: PALETTE[1] })]), t("keyShared")],
  ];
  document.getElementById("key").replaceChildren(...items.flatMap(([svg, text]) => [svg, h("span", {}, [text])]));
  document.getElementById("roles").replaceChildren(...ROLES.flatMap((r) => [h("dt", {}, [t(`role.${r}`)]), h("dd", {}, [t(`roleDesc.${r}`)])]));
}

function renderWarnings() {
  const list = model.warnings.map((w) => t(w.key, ...w.args));
  if (model.skipped.length) list.push(t("warn.skipped", model.skipped.join(", ")));
  document.getElementById("warn-section").hidden = list.length === 0;
  document.getElementById("warnings").replaceChildren(...list.map((w) => h("li", {}, [w])));
}

function renderDetail() {
  const box = document.getElementById("detail");
  const n = view.selected && nodeById(view.selected);
  if (!n) { box.replaceChildren(h("h2", {}, [t("detailTitle")]), h("p", { class: "hint" }, [t("detailHint")])); return; }
  const go = (id) => h("button", { class: "link", type: "button", onclick: () => select(id) }, [label(nodeById(id))]);
  const chips = [...n.repos].sort((a, b) => repoIndex(a) - repoIndex(b))
    .map((r) => h("span", { class: "chip", style: `--repo: ${repoByName(r).color}` }, [h("i"), r]));
  const rows = [];
  const row = (k, ...v) => rows.push(h("dt", {}, [k]), h("dd", {}, v));
  row(t("dRepo"), ...chips);
  if (n.kind === "image") {
    if (n.tags.size) row(t("dTags"), ...[...n.tags].flatMap((tag, i) => [i ? h("br") : null, h("span", { class: "mono" }, [tag])]));
    row(t("dId"), h("span", { class: "mono" }, [n.id]));
    if (n.placeholder) row(t("dState"), t("dUndefined"));
    if (n.layers != null) row(t("dLayers"), `${n.layers}`);
    if (n.size != null) row(t("dSize"), fmtSize(n.size), h("br"), h("span", { class: "hint" }, [t("dSizeNote")]));
    if (n.created) row(t("dCreated"), fmtDate(n.created));
    if (n.parent) row(t("dBase"), model.images.has(n.parent) ? go(n.parent) : h("span", { class: "mono" }, [n.parent]));
    const kids = (graph && graph.children.get(n.id)) || [];
    const derived = kids.filter((id) => nodeById(id).kind === "image");
    const runs = kids.filter((id) => nodeById(id).kind === "container");
    if (derived.length) row(t("dDerived"), ...derived.flatMap((id, i) => [i ? h("br") : null, go(id)]));
    if (runs.length) row(t("dContainers"), ...runs.flatMap((id, i) => [i ? h("br") : null, go(id)]));
  } else {
    row(t("dState"), stateText(n.state) || "—");
    row(t("dId"), h("span", { class: "mono" }, [n.id]));
    row(t("dFrom"), go(n.image));
    if (n.created) row(t("dCreated"), fmtDate(n.created));
  }
  box.replaceChildren(
    h("h2", {}, [t("detailTitle")]),
    h("p", { class: "detail-title" }, [n.kind === "image" ? label(n) : n.name]),
    h("div", { class: "detail-kind" }, [n.kind === "image" ? (n.placeholder ? t("kindUndefined") : roleText(n.role) || t("kindImage")) : t("kindContainer")]),
    n.kind === "image" && !n.placeholder && hasText(`roleDesc.${n.role}`) ? h("p", { class: "role-desc" }, [t(`roleDesc.${n.role}`)]) : null,
    h("dl", {}, rows),
  );
}

function renderStatus() {
  const s = document.getElementById("status");
  if (view.error) { s.textContent = t("statusError", t(view.error.key, ...view.error.args)); return; }
  if (model.repos.length === 0) { s.textContent = t(model.warnings.length ? "statusNoData" : "statusInitial"); return; }
  s.textContent = t("statusLoaded", t(view.source), model.repos.length, model.images.size, model.containers.size);
}

function renderAll() {
  renderStatus(); renderRepos(); renderWarnings(); renderGraph(); renderDetail();
  if (view.selected) highlight(view.selected);
}

function select(id) {
  view.selected = id;
  document.querySelectorAll("#graph .node").forEach((g) => g.classList.toggle("selected", g.dataset.id === id));
  renderDetail();
  highlight(id);
  const g = id && document.querySelector(`#graph .node[data-id="${id}"]`);
  if (g) g.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
}

// ---- Events -----------------------------------------------------------
const svg = document.getElementById("graph");
svg.addEventListener("click", (e) => { const g = e.target.closest(".node"); select(g ? g.dataset.id : null); });
svg.addEventListener("keydown", (e) => {
  const g = e.target.closest(".node");
  if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(g.dataset.id); }
  if (e.key === "Escape") select(null);
});
svg.addEventListener("pointerover", (e) => { const g = e.target.closest(".node"); if (g) highlight(g.dataset.id); });
svg.addEventListener("pointerout", (e) => { if (e.target.closest(".node")) highlight(view.selected); });

document.getElementById("pick").addEventListener("change", (e) => {
  const files = e.target.files;
  if (files.length) readFiles(files, "srcPicked");
  e.target.value = "";
});
document.getElementById("pick-files").addEventListener("change", (e) => {
  const files = e.target.files;
  if (files.length) readFiles(files, "srcPickedFiles");
  e.target.value = "";
});
document.getElementById("reload").addEventListener("click", () => loadFromServer().catch(showLoadError));
document.getElementById("zoom-in").addEventListener("click", () => { view.zoom = Math.min(2, +(view.zoom + 0.1).toFixed(2)); applyZoom(); });
document.getElementById("zoom-out").addEventListener("click", () => { view.zoom = Math.max(0.4, +(view.zoom - 0.1).toFixed(2)); applyZoom(); });
document.getElementById("zoom-reset").addEventListener("click", () => { view.zoom = 1; applyZoom(); });

// Dropping files is not supported. Cancel the drop so that the browser does not navigate away to the dropped file
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => e.preventDefault());

function showLoadError(err) {
  view.error = err instanceof LoadError ? { key: err.key, args: err.args } : { key: "errRaw", args: [err.message] };
  renderStatus();
}

// Apply the display language. Static text uses the data-i18n attributes; dynamic parts are replaced by re-rendering
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelector('meta[name="description"]').setAttribute("content", t("metaDesc"));
  document.querySelectorAll("[data-i18n]").forEach((e) => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll("[data-i18n-aria]").forEach((e) => e.setAttribute("aria-label", t(e.dataset.i18nAria)));
  document.querySelectorAll("[data-i18n-title]").forEach((e) => e.setAttribute("title", t(e.dataset.i18nTitle)));
  const b = document.getElementById("lang");
  b.textContent = t("langButton");
  b.title = t("langTitle");
  b.lang = lang === "ja" ? "en" : "ja";
  renderKey();
  renderAll();
}
document.getElementById("lang").addEventListener("click", () => {
  lang = lang === "ja" ? "en" : "ja";
  try { localStorage.setItem("stowgraph.lang", lang); } catch (_) { /* the display still switches even if the choice cannot be saved */ }
  applyLang();
});

applyLang();
if (location.protocol === "http:" || location.protocol === "https:") {
  document.getElementById("reload").hidden = false;
  loadFromServer().catch(showLoadError);
}
</script>
</body>
</html>
